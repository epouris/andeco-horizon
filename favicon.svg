  <!-- refined vessel mark -->
  <path d="M26 35.5 32 22l6 13.5" fill="none" stroke="#f8fafc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M28.2 31.5h7.6" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
  <!-- north mark -->
  <path d="M32 16.5v3.2" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M32 40.2v2.4" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
