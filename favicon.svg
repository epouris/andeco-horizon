<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Andeco Horizon Suite">
  <defs>
    <linearGradient id="ah-bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1f33"/>
      <stop offset="1" stop-color="#123a56"/>
    </linearGradient>
    <linearGradient id="ah-accent" x1="12" y1="20" x2="52" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#ah-bg)"/>
  <!-- subtle compass ring -->
  <circle cx="32" cy="30" r="16" fill="none" stroke="rgba(148,163,184,0.35)" stroke-width="1.25"/>
  <circle cx="32" cy="30" r="11.5" fill="none" stroke="rgba(148,163,184,0.22)" stroke-width="1"/>
  <!-- horizon -->
  <path d="M12 38c6.5-4.5 11.5-4.5 20 0s13.5 4.5 20 0" fill="none" stroke="url(#ah-accent)" stroke-width="2.2" stroke-linecap="round"/>
